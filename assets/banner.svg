<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
    
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #00F2FE; }
    
    /* Dynamic Animated Pulsing Elements in Background */
    .pulse-circle {
      animation: pulse 4s infinite alternate ease-in-out;
    }
    .float-node {
      animation: float 6s infinite alternate ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 10, 15;
      animation: dash 20s linear infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.3; }
      100% { transform: scale(1.05); opacity: 0.7; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Background Technical Grid & Pipeline Lines (Behind Text) -->
  <g opacity="0.25">
    <path d="M 100,80 L 1100,80 M 100,175 L 1100,175 M 100,270 L 1100,270" stroke="#30363d" stroke-width="1" stroke-dasharray="5,5" />
    <path class="flow-line" d="M 50,175 Q 300,50 600,175 T 1150,175" fill="none" stroke="url(#cyan-grad)" stroke-width="2" />
    <path class="flow-line" d="M 50,220 Q 400,320 800,100 T 1150,220" fill="none" stroke="url(#primary-grad)" stroke-width="2" />
  </g>

  <!-- Decorative Dynamic Background Glow Orbs -->
  <circle cx="150" cy="100" r="120" fill="#7928CA" opacity="0.15" class="pulse-circle" filter="url(#glow)" />
  <circle cx="1050" cy="250" r="140" fill="#00F2FE" opacity="0.12" class="pulse-circle" filter="url(#glow)" />

  <!-- Side Dynamic Pipeline Nodes (Visual Decoration) -->
  <g class="float-node" opacity="0.8">
    <rect x="920" y="80" width="180" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="945" cy="105" r="8" fill="#2ea043" />
    <text x="965" y="111" font-family="sans-serif" font-size="13" fill="#c9d1d9" font-weight="600">Build: Passed</text>

    <rect x="880" y="160" width="200" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="905" cy="185" r="8" fill="#58a6ff" />
    <text x="925" y="191" font-family="sans-serif" font-size="13" fill="#c9d1d9" font-weight="600">Tests: 100% Executed</text>

    <rect x="940" y="240" width="170" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="965" cy="265" r="8" fill="#bc8cff" />
    <text x="985" y="271" font-family="sans-serif" font-size="13" fill="#c9d1d9" font-weight="600">Deploy: Ready</text>
  </g>

  <!-- Foreground Title and Subtitle Content (Always Clear & Readable) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <rect x="0" y="75" width="310" height="32" rx="16" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1" />
    <text x="16" y="96" class="badge-text">⚡ CONTINUOUS INTEGRATION &amp; BUILD</text>

    <!-- Main Title -->
    <text x="0" y="160" class="title">Awesome CI &amp; Build Services 🔨</text>

    <!-- Subtitle -->
    <text x="0" y="205" class="subtitle">Curated Directory of CI/CD Platforms, Self-Hosted Runners &amp; Build Engines</text>
    <text x="0" y="235" class="subtitle" font-size="16px" fill="#6e7681">Valuations • Pricing Tiers • Free Tier Limits • Open-Source Repositories</text>

    <!-- Tech Stack Highlights -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#21262d" />
      <text x="12" y="17" font-family="sans-serif" font-size="12" fill="#8b949e">🐙 GitHub Actions</text>

      <rect x="120" y="0" width="90" height="26" rx="6" fill="#21262d" />
      <text x="132" y="17" font-family="sans-serif" font-size="12" fill="#8b949e">🏗️ Jenkins</text>

      <rect x="220" y="0" width="95" height="26" rx="6" fill="#21262d" />
      <text x="232" y="17" font-family="sans-serif" font-size="12" fill="#8b949e">🦊 GitLab CI</text>

      <rect x="325" y="0" width="95" height="26" rx="6" fill="#21262d" />
      <text x="337" y="17" font-family="sans-serif" font-size="12" fill="#8b949e">⚡ CircleCI</text>
    </g>
  </g>
</svg>
